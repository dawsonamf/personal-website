# Full build/deploy workflow, prepared by S1-23 and installed by S1-27.
#
# S1-27 merges `main` into the migration branch (which brings the registration
# copy, dispatch-only.yml, in as `.github/workflows/deploy.yml`) and then copies
# THIS file over it on `engine-rewrite`. Editing the arriving file rather than
# adding a second one is what keeps Spec 1 §10 step 7's merge clean.
#
# Follows Spec 1 §10 and D21 (research/deploy-and-parity-harness.md §2.2) with
# `node-version-file: .nvmrc` instead of §2.2's `package.json`.
# `withastro/action` is deliberately not used (research §2.3): it is five steps of
# indirection over the five lines below, and pins its internals to moving tags.
# PROSE_DRAFTS must NEVER be set here. `npm run build` is the production gate, so
# drafts and unwritten prose sizes have to fail the deploy. There is no vendor
# lifecycle hook either: `public/vendor/` is committed (D5).
#
# Spec 1 §10 calls the branch `astro`; the real branch name is `engine-rewrite`.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Actually deploy (unchecked = build-only dry run)"
        type: boolean
        default: false

# Least privilege: the build job only reads the repo. The deploy job's own
# permissions block below replaces this for that job.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `npm run build`, never `npx astro build`: the build script is the gate.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # A dispatched `deploy` arrives as a real boolean (the input is typed), so an
    # unchecked box is falsy and the dry run stops after build + upload.
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block. actions/deploy-pages
    # documents exactly these two ("pages: write # to deploy to Pages",
    # "id-token: write # to verify the deployment originates from an appropriate
    # source") and needs no checkout, so `contents` is not granted here.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
