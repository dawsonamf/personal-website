# Refreshes the archived AI job-market research snapshots (NY Fed cohorts,
# Canaries/ADP, FRED DFII10). Weekly because the fastest source publishes
# monthly. The archive is outside public/, so snapshot commits do not change the
# deployed site and do not need to dispatch the deployment workflow.
# Manual run: Actions tab -> "Refresh chart data" -> Run workflow.
name: Refresh chart data

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC (off the hour; :00 crons get delayed)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stdlib-only script (xlsx/zip parsed by hand), so no pip installs.
      - name: Rebuild data snapshots
        run: python3 archive/posts/ai-job-market/scripts/prebake-cohort-data.py

      - name: Commit and push if changed
        run: |
          git add archive/posts/ai-job-market/data/cohort-unemployment-data.json \
                  archive/posts/ai-job-market/data/cohort-swe-age-data.json \
                  archive/posts/ai-job-market/data/rate-data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh chart data snapshots"
            git push
          fi
